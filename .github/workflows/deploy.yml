name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same branch so stale builds don't block new ones.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm vitest run --config ./vitest.config.mts

      # All env vars (DATABASE_URL, PAYLOAD_SECRET, etc.) are already set in
      # Vercel's dashboard — no need to build locally and upload prebuilt.
      # Let Vercel build on its own infrastructure (faster cache, better CPUs).
      - name: Deploy to Vercel (production)
        if: github.ref == 'refs/heads/main'
        run: pnpm vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        if: github.ref != 'refs/heads/main'
        run: |
          pnpm vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
          DYNAMIC_URL="http://localhost:3000/es?preview=JPlCl39D3J9G"
          echo "app_url=$DYNAMIC_URL" >> $GITHUB_OUTPUT

