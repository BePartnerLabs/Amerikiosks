name: Deploy

on:
  # `main` is deliberately absent. Merging to main used to fire a preview
  # deploy nobody looked at, and publishing the release then rebuilt the same
  # commit for production — two builds per change. Previews now come only from
  # `preview/**` branches, where they are actually reviewed.
  push:
    branches:
      - 'preview/**'
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does this release drop or rename anything?
  #
  # It decides whether the *public* site is closed during the migrate→deploy
  # window, so it deliberately errs toward "yes": a false positive costs a
  # couple of minutes of maintenance page, a false negative costs 500s.
  #
  # Only migrations added since the previous tag can run, so those are the only
  # files worth reading. An `ADD COLUMN` is invisible to the old build; a
  # `DROP COLUMN` is not, which is the whole point of this job.
  plan:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      hasMigrations: ${{ steps.check.outputs.hasMigrations }}
      destructive: ${{ steps.check.outputs.destructive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          set -euo pipefail
          CURRENT="${{ github.event.release.tag_name }}"
          PREV="$(git tag --sort=-creatordate | grep -Fxv "$CURRENT" | head -1 || true)"

          if [ -z "$PREV" ]; then
            echo "No previous tag to compare against — assuming the worst."
            echo "hasMigrations=true" >> "$GITHUB_OUTPUT"
            echo "destructive=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES="$(git diff --name-only --diff-filter=A "$PREV".."$CURRENT" -- 'src/migrations/*.ts' || true)"

          if [ -z "$FILES" ]; then
            echo "No new migrations between $PREV and $CURRENT — nothing to lock for."
            echo "hasMigrations=false" >> "$GITHUB_OUTPUT"
            echo "destructive=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New migrations:"; echo "$FILES"
          echo "hasMigrations=true" >> "$GITHUB_OUTPUT"

          # Scoped to the `up` function on purpose. Reading the whole file made
          # every migration look destructive: a `down` undoes an ADD COLUMN with
          # a DROP COLUMN, so an additive migration always matched. Verified
          # against real files — form_display_title and footer_contact_heading
          # are pure ADD COLUMN and were both classified as destructive.
          if echo "$FILES" | xargs awk '/export async function up/,/export async function down/' \
            | grep -qEi 'DROP COLUMN|DROP TABLE|RENAME COLUMN|RENAME TO'; then
            echo "→ drops/renames present: the old build will query columns that no longer exist."
            echo "destructive=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ additive only: the old build keeps working against the new schema."
            echo "destructive=false" >> "$GITHUB_OUTPUT"
          fi

  # `migrate` runs against the live database while the OLD build is still
  # serving, so between it and the promotion there is a window where new schema
  # meets old code.
  #
  # `/admin` and `/api` are closed for that window — an editor writing
  # mid-migration can corrupt data. Skipped entirely when the release adds no
  # migration files: `migrate` is then a no-op, so there is nothing to write
  # against and nothing to protect. That matters because `/api` and `/next/*`
  # are how a form submission reaches the server, and closing them on a release
  # that changes no schema is a window where a lead can be lost for no reason.
  #
  # The public site is closed too, but ONLY when `plan` saw a drop or a rename.
  # This used to be left open on the assumption that "reads survive"; they do
  # not. v1.38.0 moved the Form block's panel columns into a `_locales` table
  # and dropped the originals, and for ~90 seconds every page carrying that
  # block answered 500 with `column pages__blocks_formBlock.intro_content does
  # not exist` — the home page and /contact among them. A maintenance page is
  # the honest answer there; closing the site on every release would be
  # needless downtime, since most carry no migrations at all.
  lock:
    needs: [plan]
    if: github.event_name == 'release' && needs.plan.outputs.hasMigrations == 'true'
    runs-on: ubuntu-latest
    # Same GitHub Environment the reusable deploy workflow uses — the Vercel
    # secrets are scoped to it and resolve to empty strings without this.
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@${{ vars.VERCEL_CLI_VERSION || '57.0.0' }}

      - name: Enable maintenance rules
        run: |
          vercel firewall rules enable "maintenance-admin"
          vercel firewall rules enable "maintenance-api"
          vercel firewall publish --yes

      # `|| true`: the rule is created by hand in the Vercel dashboard, like
      # the other two. Until it exists this is a no-op rather than a failed
      # release — a missing maintenance page must never be what stops a deploy.
      - name: Close the public site (drops/renames only)
        if: needs.plan.outputs.destructive == 'true'
        run: |
          vercel firewall rules enable "maintenance-site" || {
            echo "::warning::maintenance-site rule not configured — visitors will see errors during the migrate→deploy window."
            exit 0
          }
          vercel firewall publish --yes

  migrate:
    needs: [lock]
    # `lock` is skipped on preview deploys; without this, skipping it would
    # cascade and skip the whole pipeline.
    if: always() && !failure() && !cancelled()
    uses: BePartnerLabs/centralized-workflows/.github/workflows/migrate-payload.yml@v1
    with:
      environment: ${{ github.event_name == 'release' && 'production' || 'preview' }}
    secrets: inherit

  deploy:
    needs: migrate
    # Same reason as `migrate` above, one step further down the chain: a
    # skipped job cascades to everything that depends on it, transitively.
    # `migrate` opting out of the cascade was not enough — `deploy` inherited
    # it through `migrate`'s own `needs: [lock]`, so a push to preview/**
    # migrated the database and then quietly shipped nothing.
    # `!failure()` still holds the gate: if the migration fails, this is
    # skipped rather than deploying against a half-migrated database.
    if: always() && !failure() && !cancelled()
    uses: BePartnerLabs/centralized-workflows/.github/workflows/deploy-vercel.yml@v1
    with:
      environment: ${{ github.event_name == 'release' && 'production' || 'preview' }}
      prod: ${{ github.event_name == 'release' }}
      # Same pin as lock/unlock above, so all three run one CLI version against a
      # release. `vars` (unlike `env`) is available in a reusable workflow's
      # `with:`, so setting the VERCEL_CLI_VERSION Actions variable bumps every
      # job at once — no edit to centralized-workflows needed.
      vercel-cli-version: ${{ vars.VERCEL_CLI_VERSION || '57.0.0' }}
    secrets: inherit

  unlock:
    needs: [lock, migrate, deploy]
    # Unconditional on purpose: a failed migrate or deploy must not leave the
    # client locked out of /admin with no obvious cause. `!= 'skipped'` (not
    # `== 'success'`) so a release cancelled mid-lock still gets unlocked —
    # disabling already-disabled rules is a no-op, so over-running is safe.
    if: always() && needs.lock.result != 'skipped'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@${{ vars.VERCEL_CLI_VERSION || '57.0.0' }}

      - name: Disable maintenance rules
        run: |
          vercel firewall rules disable "maintenance-admin"
          vercel firewall rules disable "maintenance-api"
          # Unconditional, unlike the enable: if `plan` was wrong, or the job
          # that set it never ran, the site must still come back.
          vercel firewall rules disable "maintenance-site" || true
          vercel firewall publish --yes
