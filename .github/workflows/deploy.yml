name: Deploy to Vercel

on:
  release:
    types: [published]
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  migrate:
    name: Run DB migrations (${{ github.event_name == 'release' && 'production' || 'preview' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel env vars
        run: pnpm vercel env pull .env.local --yes --environment=${{ github.event_name == 'release' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify env vars pulled
        run: |
          if ! grep -q "PAYLOAD_SECRET" .env.local 2>/dev/null; then
            echo "ERROR: PAYLOAD_SECRET not found in pulled .env.local — check VERCEL_TOKEN secret and Vercel env vars"
            exit 1
          fi

      - name: Run migrations
        run: pnpm dotenv -e .env.local -- pnpm payload migrate
        env:
          CI: true

  deploy:
    name: Deploy to Vercel (${{ github.event_name == 'release' && 'production' || 'preview' }})
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel (production)
        if: github.event_name == 'release'
        run: pnpm vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        if: github.event_name == 'push'
        run: pnpm vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
